<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: url('img4.jpg') center/cover no-repeat;
            color: white;
            text-align: center;
        }

        /* Header */
        header {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            padding: 15px;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            color: #ffbf00;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            padding: 5px;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #ffbf00;
        }

        .menu-toggle {
            display: none;
            font-size: 24px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            nav ul {
                display: none;
                flex-direction: column;
                position: absolute;
                background: rgba(0, 0, 0, 0.8);
                width: 100%;
                left: 0;
                top: 60px;
                text-align: center;
                padding: 10px 0;
            }

            nav ul.active {
                display: flex;
            }

            .menu-toggle {
                display: block;
            }
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .cta-button {
            background-color: #ffbf00;
            color: black;
            border: none;
            padding: 14px 28px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 8px;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .cta-button:hover {
            background-color: #e6a800;
            transform: scale(1.1);
        }

        /* Cards */
        .card-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 40px;
        }

        .card {
            width: 280px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.5);
        }

        .card img {
            width: 100%;
            border-radius: 10px;
        }

        .card-info {
            display: none;
            margin-top: 10px;
            color: #fcec03;
        }

        .card.active .card-info {
            display: block;
        }

        .card button {
            margin-top: 10px;
            padding: 10px 15px;
            border: none;
            background-color: #e6a800;
            color: black;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .card button:hover {
            background-color: #ffbf00;
        }

        /* Footer */
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Vision Fitness</h1>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <nav>
            <ul id="nav-menu">
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
                <li><button class="cta-button" onclick="downloadApp()">GET IT</button></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1>Transform Your Body Today!</h1>
        <button class="cta-button" onclick="window.location.href='#services'">Get Started</button>
    </section>

    <div class="card-container">
        <div class="card" onclick="toggleCard(this)">
            <img src="profilemain.jpeg" alt="Profile">
            <h3>Profile</h3>
            <p class="card-info">Track your workouts, monitor progress, and stay motivated.</p>
            <button>Learn More</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Vision Fitness. All Rights Reserved.</p>
    </footer>

    <script>
        function toggleMenu() {
            document.getElementById("nav-menu").classList.toggle("active");
        }
        function toggleCard(card) {
            card.classList.toggle("active");
        }
        function downloadApp() {
            window.location.href = "https://drive.google.com/uc?export=download&id=1GlpNCuRmlJmfsRjB6_wQGxn8f2c1zapi";
        }
    </script>
</body>

</html>
